[workspace]
resolver = "2"
members = [
  "crates/moyumax-core",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/SakuraRed/MoyuMax"
rust-version = "1.96"

[workspace.dependencies]
futures-util = "=0.3.33"
reqwest = { version = "=0.13.4", default-features = false, features = ["deflate", "form", "gzip", "json", "rustls", "stream", "system-proxy"] }
regex = "=1.13.1"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }
tauri-build = "=2.6.3"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tempfile = "=3.27.0"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
windows-sys = { version = "=0.60.2", features = ["Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Storage_FileSystem"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
