[workspace]
resolver = "2"
members = [
  "crates/moyumax-core",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0-preview.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/SakuraRed/MoyuMax"
rust-version = "1.96"

[workspace.dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tempfile = "=3.27.0"
thiserror = "=2.0.19"
