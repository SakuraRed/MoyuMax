name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 静态检查与测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（rust-toolchain.toml）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  frontend:
    name: 前端检查与行为验收
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 启用 corepack（pnpm@10.26.2）
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install --frozen-lockfile
        run: corepack pnpm install --frozen-lockfile

      - name: lint
        run: corepack pnpm --filter @moyumax/desktop lint

      - name: vitest
        run: corepack pnpm --filter @moyumax/desktop test

      - name: build
        run: corepack pnpm --filter @moyumax/desktop build

      - name: Playwright 浏览器
        run: corepack pnpm --filter @moyumax/desktop exec playwright install chromium

      - name: Playwright e2e
        run: corepack pnpm --filter @moyumax/desktop test:e2e

  bundle:
    name: NSIS 构建与产物
    runs-on: windows-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 启用 corepack（pnpm@10.26.2）
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install --frozen-lockfile
        run: corepack pnpm install --frozen-lockfile

      - name: 安装 Rust 工具链（rust-toolchain.toml）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 图标与 SBOM 一致性
        run: |
          node scripts/generate-icon.mjs --check
          node scripts/generate-sbom.mjs --check

      - name: tauri build（x64 NSIS，未签名）
        run: corepack pnpm --filter @moyumax/desktop tauri build

      - name: 上传安装器与 SBOM 工件
        uses: actions/upload-artifact@v4
        with:
          name: moyumax-nsis-preview
          path: |
            target/release/bundle/nsis/*.exe
            docs/SBOM.json
            docs/THIRD-PARTY-LICENSES.md
          retention-days: 14
